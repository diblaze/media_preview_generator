name: Windows node

# The Plex database role on Windows: its tests on a real Windows machine, and the PyInstaller build started and called.
on:
  pull_request:
    paths:
      - "nodes/**"
      - "media_preview_generator/nodes/**"
      - "media_preview_generator/markers/publishers/plex_*.py"
      - "media_preview_generator/markers/fs.py"
      - "media_preview_generator/loudness/**"
      - "media_preview_generator/library_health/plex_rows.py"
      - "tests/test_winplatform.py"
      - "tests/nodes/**"
      - ".github/workflows/windows-node.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-node-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Plex database tests on Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the app with dev extras
        shell: pwsh
        run: pip install -e ".[dev]"
      - name: Run the Plex database and winplatform tests
        shell: pwsh
        run: |
          # Files that a later change removes drop out instead of failing the run.
          $files = @(
            "tests/test_winplatform.py",
            "tests/markers/test_plex_db_publisher.py",
            "tests/markers/test_plex_db_lock.py",
            "tests/nodes/test_plex_db_role.py",
            "tests/test_plex_chapters.py",
            "tests/nodes/test_plex_db_loudness.py",
            "tests/nodes/test_plex_db_library_health.py",
            "tests/nodes/test_plex_db_windows.py",
            "tests/markers/test_plex_remote.py"
          ) | Where-Object { Test-Path $_ }
          # Two workers: the runner's disk is slow to commit, and the lock-timing tests share it.
          python -m pytest --no-cov -n 2 -q -rfEs -p no:cacheprovider @files
          exit $LASTEXITCODE

  build:
    name: Build and smoke-test the Windows node
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # setuptools-scm works the app version out from the tags
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Is the node server here yet
        id: ready
        shell: pwsh
        run: |
          $missing = @("media_preview_generator/nodes/server/app.py", "media_preview_generator/nodes/server/plex_db.py") |
            Where-Object { -not (Test-Path $_) }
          if ($missing) {
            "::notice::Skipping the Windows build: $($missing -join ', ') not in this tree yet (node server lanes)."
            "run=false" >> $env:GITHUB_OUTPUT
          } else {
            "run=true" >> $env:GITHUB_OUTPUT
          }
      - name: Build
        if: steps.ready.outputs.run == 'true'
        shell: pwsh
        run: ./nodes/windows/build.ps1
      - name: Self-test the build (everything the role imports is in it)
        if: steps.ready.outputs.run == 'true'
        shell: pwsh
        run: |
          ./dist/PlexDbNode/PlexDbNode-debug.exe --self-test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # The loudness undo is in the build too: with no undo record it says so and changes nothing.
          $empty = Join-Path $env:RUNNER_TEMP "undo-check"
          $said = ./dist/PlexDbNode/PlexDbNode-debug.exe --undo-loudness --config-dir $empty --plex-config-dir $empty 2>&1
          if ($LASTEXITCODE -ne 1 -or "$said" -notmatch "No loudness undo record") { throw "--undo-loudness: $said" }
          "ok   --undo-loudness runs in the build"
          # The undo's expected exit code 1 is still $LASTEXITCODE; pwsh would end the step with it.
          exit 0
      - name: Smoke-test the windowed build
        if: steps.ready.outputs.run == 'true'
        shell: pwsh
        run: |
          python nodes/windows/smoke_test.py dist/PlexDbNode/PlexDbNode.exe
          exit $LASTEXITCODE
      - name: Package the download (the PlexDbNode folder with install.ps1 beside it, as the README says)
        if: steps.ready.outputs.run == 'true'
        shell: pwsh
        run: |
          $package = "dist/PlexDbNode-windows"
          if (Test-Path $package) { Remove-Item -Recurse -Force $package }
          New-Item -ItemType Directory $package | Out-Null
          Copy-Item -Recurse dist/PlexDbNode (Join-Path $package "PlexDbNode")
          Copy-Item nodes/windows/install.ps1, nodes/windows/uninstall.ps1, nodes/windows/README.md $package
      - name: Install for this user, call it, log on again, uninstall
        if: steps.ready.outputs.run == 'true'
        shell: pwsh
        run: |
          $key = -join ((1..32) | ForEach-Object { "{0:x}" -f (Get-Random -Maximum 16) })
          "::add-mask::$key"
          $env:NODE_KEY = $key
          $plex = Join-Path $env:RUNNER_TEMP "Plex Media Server"
          New-Item -ItemType Directory -Force $plex | Out-Null
          $runKey = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run"
          $sibling = "MediaPreviewGeneratorCiSibling"
          # Another program's logon entry, which installing must leave alone.
          if (-not (Test-Path $runKey)) { New-Item -Path $runKey | Out-Null }
          Set-ItemProperty -Path $runKey -Name $sibling -Value '"C:\Windows\System32\notepad.exe"'
          # From the unzipped download, as the README says, with the trailing backslash tab completion adds.
          ./dist/PlexDbNode-windows/install.ps1 -Port 9495 -PlexConfigDir "$plex\"
          if (-not (Get-ItemProperty $runKey -Name MediaPreviewGeneratorPlexDbNode -ErrorAction SilentlyContinue)) {
            throw "install.ps1 left no logon entry"
          }
          if (-not (Get-ItemProperty $runKey -Name $sibling -ErrorAction SilentlyContinue)) {
            throw "install.ps1 deleted another program's logon entry"
          }
          Remove-ItemProperty -Path $runKey -Name $sibling
          "ok   another program's logon entry survived the install"
          $ping = Invoke-RestMethod http://127.0.0.1:9495/v1/ping -Headers @{ Authorization = "Bearer $key" }
          if (-not $ping.ok) { throw "the installed node didn't answer /v1/ping" }
          "ok   the installed node answers /v1/ping"
          $info = Invoke-RestMethod http://127.0.0.1:9495/v1/info -Headers @{
            Authorization = "Bearer $key"; "X-MPG-Node-Protocol" = "1"
          }
          if ($info.plex_db.config_dir.TrimEnd("\") -ne $plex) {
            throw "the node serves '$($info.plex_db.config_dir)', not '$plex'"
          }
          "ok   a Plex folder with a trailing backslash reaches the node intact"
          # The next logon: the logon entry's own command line, without this session's NODE_KEY.
          Get-Process -Name PlexDbNode -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Milliseconds 500
          $env:NODE_KEY = $null
          $entry = (Get-ItemProperty $runKey).MediaPreviewGeneratorPlexDbNode
          if ($entry -notmatch '^"([^"]+)"\s*(.*)$') { throw "unexpected logon entry: $entry" }
          Start-Process -FilePath $Matches[1] -ArgumentList $Matches[2]
          $ping = $null
          for ($i = 0; $i -lt 60 -and -not $ping; $i++) {
            Start-Sleep -Milliseconds 500
            try {
              $ping = Invoke-RestMethod http://127.0.0.1:9495/v1/ping -Headers @{ Authorization = "Bearer $key" }
            } catch { }
          }
          if (-not $ping.ok) { throw "after a logon the node doesn't take the key install.ps1 printed" }
          "ok   the key install.ps1 printed still works after the next logon"
          # A loudness undo record, which -RemoveData keeps: it is the only way to put Plex's audio tracks back.
          $nodeDir = Join-Path $env:LOCALAPPDATA "MediaPreviewGenerator\node"
          $undoRecord = Join-Path $nodeDir "loudness-writes.jsonl"
          Set-Content -Path $undoRecord -Value "{}"
          ./nodes/windows/uninstall.ps1 -RemoveData
          if (Get-ItemProperty $runKey -Name MediaPreviewGeneratorPlexDbNode -ErrorAction SilentlyContinue) {
            throw "uninstall.ps1 left the logon entry"
          }
          if (Get-Process -Name PlexDbNode -ErrorAction SilentlyContinue) { throw "uninstall.ps1 left the node running" }
          if (Test-Path (Join-Path $env:LOCALAPPDATA "Programs\MediaPreviewGenerator\PlexDbNode")) {
            throw "uninstall.ps1 left the program folder"
          }
          "ok   uninstall.ps1 removed the entry, the process and the folder"
          if (Test-Path (Join-Path $nodeDir "node.json")) { throw "uninstall.ps1 -RemoveData left the key" }
          if (-not (Test-Path $undoRecord)) { throw "uninstall.ps1 -RemoveData deleted the loudness undo record" }
          "ok   -RemoveData deleted the key and kept the loudness undo record"
          ./nodes/windows/uninstall.ps1 -RemoveUndoRecord
          if (Test-Path $undoRecord) { throw "uninstall.ps1 -RemoveUndoRecord left the loudness undo record" }
          "ok   -RemoveUndoRecord deleted the loudness undo record"
      - name: Upload the build
        if: steps.ready.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: PlexDbNode-windows
          # One folder: the zip holds install.ps1, uninstall.ps1, README.md and PlexDbNode\ side by side.
          path: dist/PlexDbNode-windows
          retention-days: 7
